<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:url" content="https://rpavault.com{{ page.url }}">

<body {% if course_slug %}data-course-slug="{{ course_slug }}"{% endif %}>
