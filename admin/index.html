<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | RPAVault</title>
  </head>
  <body>
    <!-- Include the script that builds the page and loads Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Load the website stylesheet inside the CMS preview panel
      CMS.registerPreviewStyle("/assets/css/style.css");

      // Custom Preview template for Website Pages using official createClass API
      var PagesPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var body = entry.getIn(['data', 'body']) || '';
          return h('div', { dangerouslySetInnerHTML: { __html: body } });
        }
      });
      CMS.registerPreviewTemplate("pages", PagesPreview);

      // Custom Preview template for Course Pages
      var CoursePreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var body = entry.getIn(['data', 'body']) || '';
          return h('div', { dangerouslySetInnerHTML: { __html: body } });
        }
      });
      CMS.registerPreviewTemplate("course", CoursePreview);

      // Custom Preview template for Shared Components
      var ComponentsPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var body = entry.getIn(['data', 'body']) || '';
          return h('div', { dangerouslySetInnerHTML: { __html: body } });
        }
      });
      CMS.registerPreviewTemplate("components", ComponentsPreview);

      // Custom Preview template for Blog Posts
      var BlogPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var widgetFor = this.props.widgetFor;
          
          return h('div', { className: 'content-section' },
            h('div', { className: 'container' },
              h('div', { className: 'article-body' },
                h('h1', {}, entry.getIn(['data', 'title'])),
                h('p', { className: 'post-meta' }, entry.getIn(['data', 'date'])),
                h('div', {}, widgetFor('body'))
              )
            )
          );
        }
      });
      CMS.registerPreviewTemplate("blog", BlogPreview);
    </script>
  </body>
</html>
