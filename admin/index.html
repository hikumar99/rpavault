<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | RPAVault</title>
    <style>
      /* Custom Premium Styling for Decap CMS Login Page */
      body {
        background: radial-gradient(circle at top right, #101c42, #0d0e1c, #050508) !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }
      div[class*="LoginCard"] {
        background: rgba(255, 255, 255, 0.03) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        border-radius: 20px !important;
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5) !important;
        padding: 40px !important;
        max-width: 440px !important;
        width: 100% !important;
      }
      div[class*="LoginCard"] h1 {
        color: #ffffff !important;
        font-size: 26px !important;
        font-weight: 700 !important;
        letter-spacing: -0.5px !important;
        margin-bottom: 28px !important;
        text-align: center !important;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4) !important;
      }
      button[class*="LoginButton"] {
        background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc) !important;
        border: none !important;
        border-radius: 10px !important;
        color: #ffffff !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        padding: 14px 28px !important;
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s !important;
        box-shadow: 0 4px 16px 0 rgba(67, 100, 247, 0.4) !important;
        cursor: pointer !important;
      }
      button[class*="LoginButton"]:hover {
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 22px 0 rgba(67, 100, 247, 0.6) !important;
        opacity: 0.95 !important;
      }
    </style>
  </head>
  <body>
    <!-- Include the script that builds the page and loads Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Load the website stylesheet inside the CMS preview panel
      CMS.registerPreviewStyle("/assets/css/style.css");

      // Register a dynamic preview template for blogs to make them look like the live website
      CMS.registerPreviewTemplate("blog", function(opts) {
        var entry = opts.entry;
        var widgetFor = opts.widgetFor;
        
        return h('div', { className: 'content-section' },
          h('div', { className: 'container' },
            h('div', { className: 'article-body' },
              h('h1', {}, entry.getIn(['data', 'title'])),
              h('p', { className: 'post-meta' }, entry.getIn(['data', 'date'])),
              h('div', {}, widgetFor('body'))
            )
          )
        );
      });
    </script>
  </body>
</html>
