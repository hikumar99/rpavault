backend:
  name: github
  repo: hikumar99/rpavault
  branch: main
  site_domain: rpavault.pages.dev
  base_url: https://rpavault.pages.dev
  auth_endpoint: auth
local_backend: true

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/blog-post.html"}
      - {label: "Title (SEO)", name: "title", widget: "string"}
      - {label: "Description (SEO)", name: "description", widget: "string"}
      - {label: "Open Graph Image (Social Sharing)", name: "og_image", widget: "image", required: false}
      - {label: "Canonical URL", name: "canonical_url", widget: "string", required: false}
      - {label: "Author", name: "author", widget: "relation", collection: "team", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false}
      - {label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: "Draft (Hide from Live Site)", name: "draft", widget: "boolean", default: false, required: false}
      - {label: "Category", name: "category", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false}
      - {label: "Cover Image", name: "image", widget: "image", required: false}
      - {label: "Guidance CTA Text (Bottom)", name: "cta_text", widget: "text", required: false, default: "Tell us your background — we’ll recommend the track that actually fits, honestly."}
      - {label: "Tags", name: "tags", widget: "hidden", default: "blog"}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "course"
    label: "Course Pages"
    folder: "course"
    create: true
    nested:
      depth: 10
    path: "{{slug}}/index"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/course-detail.html"}
      - {label: "Tags", name: "tags", widget: "hidden", default: ["course"]}
      - {label: "Card Image", name: "card_image", widget: "image", required: false}
      - {label: "Card Category", name: "card_category", widget: "select", options: ["rpa", "data", "testing"], required: false}
      - {label: "Card Live Status", name: "card_live", widget: "boolean", default: true}
      - {label: "Card Blurb/Description", name: "card_blurb", widget: "string", required: false}
      - {label: "Title (SEO)", name: "title", widget: "string"}
      - {label: "Description (SEO)", name: "description", widget: "string"}
      - {label: "Open Graph Image (Social Sharing)", name: "og_image", widget: "image", required: false}
      - {label: "Canonical URL", name: "canonical_url", widget: "string", required: false}
      - {label: "Course Slug", name: "course_slug", widget: "string", hint: "Must exactly match the folder name for standard navigation to work."}
      - {label: "Draft (Hide from Live Site)", name: "draft", widget: "boolean", default: false, required: false}
      - {label: "Category Name", name: "category", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "title", display_fields: ["title"], required: false}
      - {label: "Category Eyebrow", name: "eyebrow", widget: "string", required: false}
      - {label: "Course Header Title", name: "name", widget: "string", required: false}
      - {label: "Lead Description", name: "lead", widget: "text", required: false}
      - {label: "Featured Stats/Chips", name: "chips", widget: "list", field: {label: "Chip Text", name: "chip", widget: "string"}, required: false}
      - {label: "Quick Fact: Duration", name: "duration", widget: "string", required: false}
      - {label: "Quick Fact: Classes/Format", name: "classes", widget: "string", required: false}
      - {label: "Quick Fact: Mode", name: "mode", widget: "string", required: false}
      - {label: "Quick Fact: Level", name: "level", widget: "string", required: false}
      - {label: "Quick Fact: Support Info", name: "support", widget: "string", required: false}
      - {label: "Pricing: INR Price", name: "price_inr", widget: "string", required: false}
      - {label: "Pricing: INR Strikeout Price", name: "price_inr_strike", widget: "string", required: false}
      - {label: "Pricing: USD Price", name: "price_usd", widget: "string", required: false}
      - {label: "Pricing: USD Strikeout Price", name: "price_usd_strike", widget: "string", required: false}
      - {label: "Pricing: Payment INR Checkout URL", name: "payment_inr_url", widget: "string", required: false}
      - {label: "Pricing: Payment USD Checkout URL", name: "payment_usd_url", widget: "string", required: false}
      - {label: "Next Cohort Date Info", name: "next_batch", widget: "string", required: false}
      - {label: "WhatsApp Group Link Slug", name: "whatsapp_group_url", widget: "string", required: false}
      - {label: "WhatsApp Jobs Link Slug", name: "whatsapp_jobs_url", widget: "string", required: false}
      - {label: "Syllabus PDF File", name: "syllabus_pdf", widget: "file", required: false}
      - {label: "Who is this for (Fit Checks)", name: "fit_check", widget: "list", field: {label: "Points", name: "point", widget: "string"}, required: false}
      - {label: "What you will master (Outcomes)", name: "what_you_get", widget: "list", field: {label: "Points", name: "point", widget: "string"}, required: false}
      - label: "Demo Videos"
        name: "videos"
        widget: "list"
        required: false
        collapsed: true
        summary: '{{fields.title}}'
        fields:
          - {label: "Video Title", name: "title", widget: "string"}
          - {label: "Video Embed URL", name: "url", widget: "string"}
          - {label: "Video Description", name: "description", widget: "text"}
      - label: "Trainers"
        name: "trainers"
        widget: "list"
        required: false
        collapsed: true
        summary: '{{fields.name}} - {{fields.role}}'
        fields:
          - {label: "Trainer Name", name: "name", widget: "string"}
          - {label: "Avatar Initials", name: "avatar", widget: "string"}
          - {label: "Role", name: "role", widget: "string"}
          - {label: "Detailed Biography", name: "bio", widget: "text"}
          - {label: "LinkedIn Profile Link", name: "linkedin", widget: "string", required: false}
          - {label: "Highlights & Accomplishments", name: "highlights", widget: "list", field: {label: "Highlight Item", name: "item", widget: "string"}, required: false}
          - {label: "Official Certifications", name: "certifications", widget: "list", field: {label: "Certification Item", name: "item", widget: "string"}, required: false}
      - label: "Curriculum Phases"
        name: "curriculum"
        widget: "list"
        required: false
        collapsed: true
        summary: '{{fields.phase}}'
        fields:
          - {label: "Phase Title", name: "phase", widget: "string"}
          - {label: "Phase Duration (no of classes / duration label)", name: "duration", widget: "string"}
          - {label: "Phase Outcome", name: "outcome", widget: "string"}
          - label: "Sessions / Classes"
            name: "sessions"
            widget: "list"
            collapsed: true
            summary: '{{fields.num}}: {{fields.title}}'
            fields:
              - {label: "Class Number (e.g. Class 1-2)", name: "num", widget: "string"}
              - {label: "Class Title", name: "title", widget: "string"}
              - {label: "Class Description / Details", name: "details", widget: "text"}
      - label: "Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        required: false
        collapsed: true
        summary: '{{fields.q}}'
        fields:
          - {label: "Question", name: "q", widget: "string"}
          - {label: "Answer", name: "a", widget: "text"}

  - name: "pages"
    label: "Website Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "index.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "about"
        label: "About Page"
        file: "about.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "contact"
        label: "Contact Page"
        file: "contact.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "consulting"
        label: "Consulting Page"
        file: "consulting.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "enterprise_automation"
        label: "Enterprise Automation Page"
        file: "enterprise-automation.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "training"
        label: "Training Page"
        file: "training.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}
      - name: "corporate_training"
        label: "Corporate Training Page"
        file: "corporate-training.html"
        fields:
          - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.html"}
          - {label: "Title (SEO)", name: "title", widget: "string"}
          - {label: "Description (SEO)", name: "description", widget: "string"}
          - {label: "Raw HTML Code", name: "body", widget: "text"}


  - name: "header"
    label: "Header / Navigation"
    files:
      - name: "header"
        label: "Header HTML Code"
        file: "_includes/partials/header.html"
        fields:
          - {label: "HTML Code", name: "body", widget: "text"}

  - name: "footer"
    label: "Footer / Info"
    files:
      - name: "footer"
        label: "Footer HTML Code"
        file: "_includes/partials/footer.html"
        fields:
          - {label: "HTML Code", name: "body", widget: "text"}

  - name: "callback_form"
    label: "Callback Form Template"
    files:
      - name: "callback_form"
        label: "Callback Form HTML Code"
        file: "_includes/partials/callback.html"
        fields:
          - {label: "HTML Code", name: "body", widget: "text"}

  - name: "settings"
    label: "Global Settings & Pricing"
    files:
      - name: "globals"
        label: "Header, Footer & Forms"
        file: "_data/settings.json"
        fields:
          - label: "Announcement Bar"
            name: "announcement"
            widget: "object"
            fields:
              - {label: "Show Announcement?", name: "show", widget: "boolean", default: false}
              - {label: "Announcement Text", name: "text", widget: "string", required: false}
              - {label: "Link URL", name: "link", widget: "string", required: false}
          - label: "Reusable Blocks (CTAs)"
            name: "blocks"
            widget: "object"
            fields:
              - {label: "Course CTA Title", name: "course_cta_title", widget: "string", default: "Enroll only when <em>you're convinced.</em>"}
              - {label: "Course CTA Subtitle", name: "course_cta_subtitle", widget: "string", default: "Join our live classes for free until you're satisfied — no card, no commitment."}
          - label: "Analytics & Tracking"
            name: "analytics"
            widget: "object"
            fields:
              - {label: "Google Analytics 4 (GA4) ID", name: "ga4_id", widget: "string", required: false, hint: "e.g., G-XXXXXXXXXX"}
              - {label: "Meta Pixel ID", name: "meta_pixel_id", widget: "string", required: false}
          - label: "Header Settings"
            name: "header"
            widget: "object"
            fields:
              - {label: "Brand Name", name: "brand_name", widget: "string"}
          - label: "Footer Settings"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Description Text", name: "description", widget: "text"}
              - {label: "Contact Email", name: "email", widget: "string"}
              - {label: "Website URL", name: "domain_url", widget: "string"}
              - {label: "Office Location", name: "location", widget: "string"}
              - label: "Quick Links"
                name: "quick_links"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Services Links"
                name: "services_links"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Social Media Links"
                name: "social"
                widget: "object"
                fields:
                  - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
                  - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
                  - {label: "YouTube URL", name: "youtube", widget: "string", required: false}
                  - {label: "Facebook URL", name: "facebook", widget: "string", required: false}
                  - {label: "Telegram URL", name: "telegram", widget: "string", required: false}
          - label: "Callback Form Configuration"
            name: "callback_form"
            widget: "object"
            fields:
              - {label: "Form Title", name: "title", widget: "string"}
              - {label: "Form Subtitle", name: "subtitle", widget: "string"}
              - label: "Form Fields"
                name: "fields"
                widget: "list"
                fields:
                  - {label: "Field Name (ID)", name: "name", widget: "string"}
                  - {label: "Label Text", name: "label", widget: "string"}
                  - {label: "Field Type", name: "type", widget: "select", options: ["text", "tel", "email", "select", "textarea"]}
                  - {label: "Is Required?", name: "required", widget: "boolean"}
                  - {label: "Autocomplete Helper", name: "autocomplete", widget: "string", required: false}
                  - {label: "Select Options (Optional)", name: "options", widget: "list", field: {label: "Option", name: "option", widget: "string"}, required: false}
          - label: "General Form Configuration"
            name: "forms"
            widget: "object"
            fields:
              - {label: "FormSubmit Endpoint URL", name: "formsubmit_endpoint", widget: "string"}

      - name: "courses_data"
        label: "Central Course Prices & Batches"
        file: "assets/data/courses.json"
        fields:
          - {label: "Last Updated Date", name: "updated", widget: "string"}
          - label: "Courses"
            name: "courses"
            widget: "object"
            fields:
              - label: "RPA Agentic (UiPath + Power Automate)"
                name: "rpa-agentic-uipath-power-automate"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "Advance Agentic RPA UiPath"
                name: "advance-agentic-rpa-uipath"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "UiPath Test Suite"
                name: "uipath-test-suite"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "MSBI Masterclass"
                name: "msbi-masterclass"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "SQL Server Masterclass"
                name: "sql-server-masterclass"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "Power BI"
                name: "power-bi"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "Playwright with TypeScript Automation Masterclass"
                name: "playwright-typescript-automation"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "Data Analytics (Power BI + SQL)"
                name: "data-analytics-power-bi-sql"
                widget: "object"
                fields:
                  - {label: "Course Name", name: "name", widget: "string"}
                  - {label: "Current Fee", name: "fee", widget: "string"}
                  - {label: "Regular Fee (Optional)", name: "regular_fee", widget: "string", required: false}
                  - {label: "Next Batch", name: "next_batch", widget: "string"}
                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}

  - name: "categories"
    label: "Categories (Taxonomy)"
    folder: "categories"
    create: true
    format: "frontmatter"
    extension: "md"
    fields:
      - {label: "Category Name", name: "title", widget: "string"}

  - name: "team"
    label: "Team & Authors"
    folder: "team"
    create: true
    format: "frontmatter"
    extension: "md"
    fields:
      - {label: "Full Name", name: "title", widget: "string"}
      - {label: "Role / Title", name: "role", widget: "string"}
      - {label: "Biography", name: "bio", widget: "text", required: false}
      - {label: "Avatar Image", name: "avatar", widget: "image", required: false}
      - {label: "LinkedIn Profile URL", name: "linkedin", widget: "string", required: false}

  - name: "testimonials"
    label: "Testimonials & Reviews"
    folder: "testimonials"
    create: true
    format: "frontmatter"
    extension: "md"
    fields:
      - {label: "Student Name", name: "name", widget: "string"}
      - {label: "Review Source (e.g. Google review)", name: "source", widget: "string", default: "Google review"}
      - {label: "Star Rating", name: "stars", widget: "string", default: "★★★★★"}
      - {label: "Review Quote", name: "quote", widget: "text"}
