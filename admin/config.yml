                  - {label: "Batch Status", name: "batch_status", widget: "select", options: ["Enrollment open", "Open for interest", "Class in progress"]}
                  - {label: "Featured", name: "featured", widget: "boolean"}
                  - {label: "Is Live", name: "live", widget: "boolean"}
              - label: "UiPath Test Suite"
                name: "uipath-test-suite"
